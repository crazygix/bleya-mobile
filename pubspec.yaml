name: bleya

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+12
environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_secure_storage: ^9.2.2
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.4
  socket_io_client: ^2.0.3+1
  image_picker: ^1.0.7
  connectivity_plus: ^6.0.5
  crypto: ^3.0.6
  geolocator: ^13.0.2
  google_sign_in: ^7.2.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  passkeys: ^2.0.1
  sign_in_with_apple: ^7.0.1
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.15
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.1
  xml: ^6.5.0

flutter:
  uses-material-design: true
  assets:
    # Outfit in the weights UiTokens uses, plus its licence (OFL.txt).
    # google_fonts finds the files by name, so keep them as they are.
    - assets/google_fonts/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#2766ff"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
